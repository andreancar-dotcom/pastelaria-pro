<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pastelaria</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:16px system-ui;margin:0;background:#f4f6fb;color:#182033}header{background:#174ea6;color:white;padding:20px}main{max-width:800px;margin:auto;padding:15px}.card{background:white;padding:16px;border-radius:14px;margin:12px 0}label{display:block;margin:10px 0 5px;font-weight:bold}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd5e5;border-radius:9px;font:inherit}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.item{border:1px solid #dbe2ef;padding:10px;border-radius:9px}.btn{background:#174ea6;color:white;border:0;border-radius:10px;padding:13px;width:100%;font-weight:bold}.total{font-size:24px;color:#174ea6;font-weight:bold}.err{color:#b42318}.ok{color:#16834a}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><header><h1>🥟 Pastelaria</h1><b>Carne • Frango • Misto — R$ 1,50 cada</b></header><main><div class="card"><h2>Faça seu pedido</h2><label>Nome</label><input id="name" placeholder="Seu nome"><label>WhatsApp</label><input id="phone" placeholder="DDD + número"><label>Retirada</label><input id="pickup" type="datetime-local"><div class="grid"><div class="item">Carne<input id="carne" type="number" min="0" value="0"></div><div class="item">Frango<input id="frango" type="number" min="0" value="0"></div><div class="item">Misto<input id="misto" type="number" min="0" value="0"></div></div><p>Unidades: <b id="units">0</b></p><div class="total" id="total">R$ 0,00</div><br><button class="btn" onclick="sendOrder()">Enviar pedido</button><p id="msg"></p><p>PIX ainda não integrado; este site registra pedidos.</p></div></main><script>
const URL="https://njewzymgmhqciesjjiozd.supabase.co";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp1eWR2ZGt4amR1cHV1cHprcmllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwNzkwNjEsImV4cCI6MjEwOTY1NTA2MX0.fk95r0PJzf_OpHHQ7sxETBLtbx45Swk1kuDvJLeq51s";
const sb=supabase.createClient(URL,KEY),fs=["carne","frango","misto"];
function calc(){let n=fs.reduce((a,f)=>a+Math.max(0,+document.getElementById(f).value||0),0);document.getElementById("units").textContent=n;document.getElementById("total").textContent=(n*1.5).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});return n}fs.forEach(f=>document.getElementById(f).oninput=calc);
async function sendOrder(){let n=calc(),name=document.getElementById("name").value.trim(),phone=document.getElementById("phone").value.trim(),m=document.getElementById("msg");if(!n||!name||!phone){m.className="err";m.textContent="Informe nome, WhatsApp e quantidades.";return}let d={customer_name:name,customer_phone:phone,pickup_at:document.getElementById("pickup").value?new Date(document.getElementById("pickup").value).toISOString():null,items:{carne:+carne.value||0,frango:+frango.value||0,misto:+misto.value||0},units:n,total_cents:n*150};let {error}=await sb.from("orders").insert(d);if(error){m.className="err";m.textContent="Erro: "+error.message;return}m.className="ok";m.textContent="Pedido enviado!";fs.forEach(f=>document.getElementById(f).value=0);calc()}calc();
</script></body></html>
